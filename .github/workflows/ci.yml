name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned: an OS kernel must build identically in six months.
          toolchain: nightly-2026-09-14
          components: rustfmt, clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none
      - run: cargo fmt --all -- --check
      - name: xtask (host)
        run: cargo clippy -p xtask --all-targets -- -D warnings
      - name: kernel clippy (bare-metal target, no all-targets flag)
        run: cargo clippy -p rustycore-kernel --target x86_64-unknown-none -- -D warnings
      - name: kernel debug
        run: cargo check -p rustycore-kernel --target x86_64-unknown-none
      - name: kernel release (opt3, LTO fat)
        run: cargo check -p rustycore-kernel --target x86_64-unknown-none --release
      - name: BIOS image builds
        run: cargo xtask image
      - name: QEMU boot smoke test
        # The kernel halts in an hlt-loop, so QEMU never exits on its own —
        # `timeout` kills it, and the serial log is the gate.
        #
        # Gate on "Phase 3 online": that line is printed by the scheduler on
        # the HEALTHY path only (after the ledger proves fairness), so it is
        # the last thing a correct boot says. It implies every earlier gate
        # passed — memory, syscall stub, LAPIC promotion, the preempt yanks.
        #
        # Do NOT gate on "Phase 2 online": the healthy path never prints it.
        # It exists only in two degraded branches (promotion skipped, or the
        # LAPIC stalling after promotion), so a grep for it would pass on a
        # broken boot and fail on a good one.
        #
        # The preempt yank line is checked separately below as a loud
        # regression marker: Step 4's whole point is that the naked 0xEF stub
        # yanks a running task mid-step, and zero yanks must fail the job.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86
          timeout 150 cargo xtask run-qemu > boot.log 2>&1 || true
          grep -aE "Phase 3 online" boot.log
          grep -aE "sched: preempt yank [1-9]" boot.log
