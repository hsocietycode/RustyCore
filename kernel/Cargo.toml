[package]
name = "rustycore-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Memory: exactly one of alloc-bump (bring-up, no reclaim) / alloc-buddy
# (production, split/merge + reclaim with two-phase bring-up — bump cursor
# pre-heap, free lists after heap is live). Scheduler: exactly one of
# sched-rr / sched-cfs. Default is RR + buddy.
default = ["arch-x86_64", "sched-rr", "alloc-buddy", "drv-uart"]
arch-x86_64 = []
sched-rr = []
sched-cfs = []
alloc-bump = []
alloc-buddy = []
drv-uart = []
drv-virtio = []
opt-speed = []
opt-size = []

[dependencies]
# Split of bootloader 0.11, done right:
# - kernel (this crate, bare-metal) links ONLY bootloader_api:
#   pure no_std, just the entry_point! macro + BootInfo types.
# - the host-side image builder (bootloader crate with std, BIOS/UEFI
#   disk image assembly) moves to xtask, which builds for the HOST
#   triple with full std. See xtask/Cargo.toml.
bootloader_api = "0.11"
x86_64 = "0.15"
spin = "0.10"
pic8259 = "0.11"
linked_list_allocator = "0.10"
lazy_static = { version = "1", features = ["spin_no_std"] }
