# RustyCore kernel configuration — один файл для кастомизации сборки.
# Честность прежде всего: каждая секция помечена, КТО её реально читает.

[arch]
target = "x86_64-unknown-none"
# Rust codegen baseline (-C target-cpu в .cargo/config.toml). Это НЕ модель
# для QEMU-флага -cpu: такой модели у QEMU нет (проверено:
# "unable to find CPU model 'x86-64-v2'"), поэтому xtask грузится с
# `-cpu max` — это надмножество v2 (POPCNT/SSE4.2 включены).
cpu = "x86-64-v2" # v2 = совместимость везде; v3 = максимум перфа (AVX2)

[sched]
default = "rr" # rr | cfs
# ВНИМАНИЕ: пока НЕ читается. Прерывание идёт от периодического LAPIC-таймера,
# квант задаётся калибровкой (10 мс), а не этим ключом. Пометка оставлена,
# чтобы не создавать ложного впечатления, что ключ что-то меняет.
quantum_us = 1000

[memory]
# Читает kernel/build.rs (экспорт в KERNEL_CONFIG_* env) + сверка с фичами.
phys_offset = "0xFFFF800000000000"
heap_size_kb = 1024
stack_size = "128K"
# bump = bring-up (no reclaim); buddy = production (split/merge + reclaim).
# Значение обязано совпадать с Cargo-фичой, иначе сборка упадает с объяснением.
frame_allocator = "buddy" # bump | buddy
# Heap self-test (Box+Vec) при каждом буте. true = ловить битую кучу сразу,
# false = пропустить ради скорости (heap всё равно инициализируется).
self_test = true

[drivers]
# drv-uart читается Cargo-фичами; virtio/ps2kbd пока только информационные —
# их подсистемы приходят в Phase 4 (VirtIO blk/net, PS/2 keyboard decode).
uart = true
virtio = true
ps2kbd = false

[log]
# ВНИМАНИЕ: пока НЕ читается. Уровень задаётся наличием/отсутствием
# serial_println! на конкретных путях, а не этим ключом.
level = "info" # trace | debug | info | warn | error

# Читает ТОЛЬКО `cargo xtask run-qemu` (единственный потребитель).
[qemu]
machine = "q35"
memory = "512M"
smp = 2
display = "none"
# Информационно: -nographic уже вешает COM1 на stdio, отдельный -serial не нужен.
serial = "stdio"
extra_args = "-no-reboot -no-shutdown"
