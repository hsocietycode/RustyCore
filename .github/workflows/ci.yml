name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none
      - run: cargo fmt --all -- --check
      - name: xtask (host)
        run: cargo clippy -p xtask --all-targets -- -D warnings
      - name: kernel clippy (bare-metal target, no all-targets flag)
        run: cargo clippy -p rustycore-kernel --target x86_64-unknown-none -- -D warnings
      - name: kernel debug
        run: cargo check -p rustycore-kernel --target x86_64-unknown-none
      - name: kernel release (opt3, LTO fat)
        run: cargo check -p rustycore-kernel --target x86_64-unknown-none --release
      - name: BIOS image builds
        run: cargo xtask image
